<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Три цикла</title>

<!-- Приложение для iPhone: Safari → «Поделиться» → «На экран Домой» -->
<meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Три цикла">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<!-- Тема — до первой отрисовки, чтобы не мигало: светлая «Чистый лист», тёмная «Табло» -->
<script>
try{ var t=(JSON.parse(localStorage.getItem('planSet')||'{}')||{}).theme; if(t==='light'||t==='dark') document.documentElement.dataset.theme=t; }catch(e){}
</script>
</head>

<body>
<main class="wrap" id="scr-now"></main>
<main class="wrap" id="scr-plan" hidden></main>
<main class="wrap" id="scr-food" hidden></main>
<main class="wrap" id="scr-me" hidden></main>

<div id="mini" hidden></div>

<nav id="tabbar" aria-label="Разделы">
  <button type="button" data-go="now" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сейчас</button>
  <button type="button" data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>План</button>
  <button type="button" data-go="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><circle cx="12" cy="13" r="4"/><path d="M12 2v3"/></svg>Еда</button>
  <button type="button" data-go="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Я</button>
</nav>

<section id="page" hidden></section>
<section id="player" hidden></section>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"><span></span><button type="button" hidden>Отменить</button></div>
